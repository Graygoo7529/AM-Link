name: Docker Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aml-memory:ci
      - name: Run container smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name aml-memory-ci -p 18080:8080 aml-memory:ci
          cleanup() {
            docker logs aml-memory-ci || true
            docker rm -f aml-memory-ci || true
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
